name: CI

on:
  push:
    branches: [main, fix/*, feature/*, chore/*]
  pull_request:
    branches: [main]

env:
  APP_KEY: base64:q6MfGq8MfGq8MfGq8MfGq8MfGq8MfGq8MfGq8MfA=
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_sqlite, bcmath
          coverage: none

      - name: Get composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Run tests
        run: php artisan test

  js-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Build assets
        run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [php-tests, js-build]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_mysql, bcmath
          coverage: none

      - run: composer install --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Start Laravel dev server
        run: |
          php artisan migrate --env=testing --force
          php artisan db:seed --env=testing --force
          php artisan serve --env=testing --port=8000 &
          sleep 3

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run E2E smoke tests
        run: npx playwright test tests/E2E
        env:
          APP_URL: http://localhost:8000
